name: Project quality Workflow

on:
  # Upstream-only checks (commit lint, spelling): the fork's patched/** branches use their
  # own commit convention and French docs, and are covered by fork-patched-ci.yml.
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    uses: suitenumerique/ci/.github/workflows/_project-quality.yml@ca6401ac83e981e5b0a94f06f68baaa6e6d0a436 # v0.0.1
    with:
      print_check_paths: src/backend src/summary src/agents
      codespell_ignore_words: "unsecure"
